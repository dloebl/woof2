[package]
name = "woff2-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
build = "build.rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
woff2 = { path = "..", default-features = false, features = ["capi", "system-brotli"] }

[build-dependencies]
cc = "1"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[lib]
path = "src/lib.rs"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_structured"
path = "fuzz_targets/decode_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "common"
path = "fuzz_targets/common.rs"
test = false
doc = false
bench = false
